name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    name: Service (typecheck + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ricerca
          POSTGRES_PASSWORD: ricerca
          POSTGRES_DB: ricerca_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ricerca -d ricerca_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ricerca:ricerca@localhost:5432/ricerca_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  sdk:
    name: SDK (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @ricerca/ramp
      - run: npm run sdk:test
      - run: npm run sdk:build
      - name: Both module formats load
        working-directory: packages/sdk
        run: |
          node -e "const m=require('@ricerca/ramp'); if(typeof m.RicercaRamp!=='function') process.exit(1)"
          node --input-type=module -e "const m=await import('@ricerca/ramp/browser'); if(typeof m.RampRunner!=='function') process.exit(1)"

  contract:
    name: Receipts contract (tests + WASM)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - run: cargo test
      - name: Install Stellar CLI
        env:
          STELLAR_CLI_VERSION: "25.2.0"
        run: |
          set -euo pipefail
          asset="stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/${asset}" -o /tmp/stellar-cli.tar.gz
          tar -xzf /tmp/stellar-cli.tar.gz -C /tmp
          sudo install -m 755 /tmp/stellar /usr/local/bin/stellar
      - run: stellar contract build
      - run: sha256sum target/wasm32v1-none/release/ramp_receipts.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: ramp-receipts-wasm
          path: contracts/target/wasm32v1-none/release/ramp_receipts.wasm
          if-no-files-found: error

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ricerca-ramp:ci .
      - name: Image starts and answers /health
        run: |
          docker run -d --name ramp -p 8080:8080 \
            -e DATABASE_URL=postgresql://unused@localhost/unused \
            -e ENCRYPTION_KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))") \
            -e WORKER_IN_PROCESS=false ricerca-ramp:ci
          for i in $(seq 1 30); do curl -fs localhost:8080/health && exit 0; sleep 1; done
          docker logs ramp; exit 1
