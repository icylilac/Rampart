name: Deploy site

# Deploys site/ to Vercel from GitHub Actions: production on every push to
# main, a preview for every pull request. Vercel's own Git integration can't
# connect a private organization repo on the Hobby plan, so this does it with
# the Vercel CLI. Each run shows up in the repo's Deployments panel.
#
# Secrets: VERCEL_TOKEN (a Vercel access token), VERCEL_ORG_ID, VERCEL_PROJECT_ID.

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site-deploy.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/site-deploy.yml"]
  workflow_dispatch:

concurrency:
  group: site-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  # Deploys need the Vercel secrets. Until they're added (or on pull requests
  # from forks, which get no secrets) the deploy is skipped, not failed.
  check:
    name: Vercel secrets
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=""
          for s in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do [ -n "${!s}" ] || missing="$missing $s"; done
          if [ -n "$missing" ]; then
            echo "::warning::Site not deployed: add the repository secret(s)$missing (Settings > Secrets and variables > Actions)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to Vercel
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'Preview' || 'Production' }}
      url: ${{ github.event_name == 'pull_request' && steps.deploy.outputs.url || 'https://userampart.vercel.app' }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      TARGET: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global vercel@64
      - name: Pull project settings
        run: vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"
      - name: Build
        run: vercel build $([ "$TARGET" = production ] && echo --prod) --token="$VERCEL_TOKEN"
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt $([ "$TARGET" = production ] && echo --prod) --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
